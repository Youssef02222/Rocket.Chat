# Rocket.Chat reverse proxy for shuchat.eg
# Copy certificates to:
#   /etc/nginx/ssl/fullchain.crt
#   /etc/nginx/ssl/private.key
# Then:
#   sudo ln -s /etc/nginx/sites-available/shuchat.eg.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# In Rocket.Chat set Site URL to: https://shuchat.eg
# If using yarn dsv, also export: ROOT_URL=https://shuchat.eg

upstream rocketchat {
	server 127.0.0.1:3000;
	keepalive 32;
}

map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}

server {
	listen 80;
	listen [::]:80;
	server_name shuchat.eg www.shuchat.eg;

	location /.well-known/acme-challenge/ {
		root /var/www/html;
	}

	location / {
		return 301 https://shuchat.eg$request_uri;
	}
}

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name shuchat.eg www.shuchat.eg;

	ssl_certificate     /etc/nginx/ssl/fullchain.crt;
	ssl_certificate_key /etc/nginx/ssl/private.key;

	ssl_session_timeout 1d;
	ssl_session_cache shared:SSL:10m;
	ssl_session_tickets off;

	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers off;

	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
	add_header X-Content-Type-Options nosniff always;
	add_header Referrer-Policy strict-origin-when-cross-origin always;

	client_max_body_size 200M;
	client_body_timeout 120s;

	access_log /var/log/nginx/shuchat.eg.access.log;
	error_log  /var/log/nginx/shuchat.eg.error.log;

	location / {
		proxy_pass http://rocketchat;
		proxy_http_version 1.1;

		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto https;
		proxy_set_header X-Forwarded-Host $host;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;

		proxy_set_header X-Forwarded-Ssl on;

		proxy_read_timeout 360s;
		proxy_send_timeout 360s;
		proxy_connect_timeout 30s;

		proxy_buffering off;
		proxy_request_buffering off;
	}

	location /sockjs {
		proxy_pass http://rocketchat;
		proxy_http_version 1.1;

		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto https;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;

		proxy_read_timeout 360s;
		proxy_buffering off;
	}

	location /websocket {
		proxy_pass http://rocketchat;
		proxy_http_version 1.1;

		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto https;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;

		proxy_read_timeout 360s;
		proxy_buffering off;
	}
}
